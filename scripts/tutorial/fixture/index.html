<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutorial recorder fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, sans-serif; background: #18202a; color: #fff; }
    #stage { position: relative; width: 1920px; min-height: 2200px; overflow: hidden; background: #18202a; }
    #phase { position: absolute; left: 650px; top: 350px; width: 620px; height: 330px; background: #273444; }
    button, input { position: absolute; font: 24px Arial, sans-serif; }
    #instant { left: 780px; top: 440px; width: 360px; height: 140px; border: 12px solid #fff; padding: 18px; background: #185adb; color: #fff; }
    #text { left: 100px; top: 720px; width: 420px; height: 60px; }
    #drag-from { left: 100px; top: 850px; width: 120px; height: 80px; }
    #drag-to { left: 480px; top: 850px; width: 120px; height: 80px; }
    #moving { left: 110px; top: 1040px; width: 260px; height: 90px; background: #a35b00; }
    #covered { left: 700px; top: 820px; width: 260px; height: 90px; }
    #cover { position: absolute; left: 680px; top: 800px; width: 300px; height: 130px; z-index: 4; background: #111; opacity: .96; }
    #offscreen { left: 780px; top: 1850px; width: 360px; height: 120px; background: #087f5b; }
    canvas { position: absolute; left: 20px; top: 20px; width: 160px; height: 100px; }
  </style>
</head>
<body>
  <main id="stage">
    <div id="phase"></div>
    <button id="instant" type="button">Immediate colour</button>
    <input id="text" aria-label="Fixture text" value="">
    <button id="drag-from" type="button">Drag</button>
    <button id="drag-to" type="button">Drop</button>
    <button id="moving" type="button">Moving target</button>
    <button id="covered" type="button">Covered target</button>
    <div id="cover">cover</div>
    <button id="offscreen" type="button">Offscreen target</button>
  </main>
  <script>
    (() => {
      const colours = ['#185adb', '#d9480f', '#2b8a3e', '#862e9c', '#e67700', '#0b7285'];
      const instant = document.querySelector('#instant');
      const phase = document.querySelector('#phase');
      const moving = document.querySelector('#moving');
      let click = 0;
      let movingFrames = 0;
      window.__fixture = { clicks: [], offscreenClicks: 0, movingClicks: 0, dragClicks: 0 };

      document.addEventListener('pointerdown', (event) => {
        const rect = event.target.getBoundingClientRect?.();
        window.__fixture.clicks.push({
          id: event.target.id || '', x: event.clientX, y: event.clientY,
          rect: rect ? { x: rect.x, y: rect.y, w: rect.width, h: rect.height } : null,
        });
        fetch(`/event?id=${encodeURIComponent(event.target.id || '')}&x=${event.clientX}&y=${event.clientY}`).catch(() => {});
      }, true);
      instant.addEventListener('click', () => {
        click++;
        const colour = colours[click % colours.length];
        instant.style.background = colour;
        phase.style.background = colour;
        phase.dataset.phase = String(click);
      });
      document.querySelector('#offscreen').addEventListener('click', () => window.__fixture.offscreenClicks++);
      moving.addEventListener('click', () => window.__fixture.movingClicks++);
      document.querySelector('#drag-from').addEventListener('click', () => window.__fixture.dragClicks++);

      document.addEventListener('pointermove', () => {
        if (movingFrames === 0) movingFrames = 1;
      }, { once: true });
      const animateMovingTarget = () => {
        if (movingFrames > 0 && movingFrames <= 8) {
          moving.style.left = `${110 + movingFrames * 7}px`;
          movingFrames++;
        }
        requestAnimationFrame(animateMovingTarget);
      };
      requestAnimationFrame(animateMovingTarget);

      if (new URLSearchParams(location.search).get('canvas') === '1') {
        const canvas = document.createElement('canvas');
        canvas.width = 160;
        canvas.height = 100;
        canvas.id = 'viewer-canvas';
        document.body.appendChild(canvas);
        const gl = canvas.getContext('webgl');
        gl.clearColor(0.2, 0.4, 0.7, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
    })();
  </script>
  <script>
    // plan-2240 fixtures, each behind its own query flag so the older cases see the page unchanged.
    (() => {
      const query = new URLSearchParams(location.search);
      const report = (path, value) => fetch(`${path}?data=${encodeURIComponent(JSON.stringify(value))}`).catch(() => {});
      // ?storage=1 — report the rv-* localStorage keys the init script left for this document.
      if (query.get('storage') === '1') {
        const seen = {};
        for (const key of Object.keys(localStorage)) if (key.startsWith('rv-')) seen[key] = localStorage.getItem(key);
        void report('/storage', seen);
      }
      // ?offset=1 — log every press and release with the rects of the offset bases.
      if (query.get('offset') === '1') {
        const rectOf = (id) => {
          const r = document.getElementById(id).getBoundingClientRect();
          return { x: r.x, y: r.y, w: r.width, h: r.height };
        };
        for (const type of ['pointerdown', 'pointerup']) {
          document.addEventListener(type, (event) => {
            void report('/geometry', {
              type, id: event.target.id || '', x: event.clientX, y: event.clientY,
              rects: { instant: rectOf('instant'), dragFrom: rectOf('drag-from'), dragTo: rectOf('drag-to') },
            });
          }, true);
        }
      }
      // ?pulse=1 — a block inside the motion region that flips black/white on every animation
      // frame while switched on; the switches sit outside the region.
      if (query.get('pulse') === '1') {
        const pulse = document.createElement('div');
        pulse.id = 'pulse';
        pulse.style.cssText = 'position:absolute;left:800px;top:620px;width:300px;height:250px;z-index:3;background:#000';
        document.body.appendChild(pulse);
        let on = false;
        let flip = false;
        const button = (id, top, value) => {
          const element = document.createElement('button');
          element.id = id;
          element.type = 'button';
          element.textContent = id;
          element.style.cssText = `left:1400px;top:${top}px;width:200px;height:60px;z-index:3`;
          element.addEventListener('click', () => { on = value; });
          document.body.appendChild(element);
        };
        button('pulse-on', 100, true);
        button('pulse-off', 200, false);
        const tick = () => {
          if (on) { flip = !flip; pulse.style.background = flip ? '#fff' : '#000'; }
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    })();
  </script>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      if (query.get('cmdfixture') !== '1') return;

      const factor = Number(query.get('factor') ?? 1);
      let subMode = query.get('mode') ?? 'animated';
      // plan-2237: `?mode=` makes the fixture a DES viewer for `sim.clock.get`; without it the
      // fixture is a continuous sim whose factor is the speed override.
      const desMode = query.has('mode');
      let multiplier = factor;
      let speed = 1;
      const community = query.get('community') === '1';
      const factorNow = () => (desMode
        ? (subMode === 'animated' ? 1 : subMode === 'hybrid' ? Math.max(1, multiplier) : subMode === 'step' ? 0 : null)
        : speed);
      const continuousMotion = query.get('motion') === 'continuous';
      const variant = query.get('variant') ?? 'base';
      const viewer = window.viewer = {
        isSimulationPaused: query.get('paused') === '1', simTime: 0, fixedStepCount: 0,
      };
      const executed = window.__fixture.executed = [];
      let watch = [];
      let watching = false;
      // plan-2237: the take-wide time-command watch of the real seam (dispatch + completion).
      let timeWatch = null;
      let timeEvents = [];
      let ticks = 0;
      let dotTicks = 0;
      const pending = [];
      const picks = new Map();
      let nextPick = 0;
      const nodes = ['Yard/AGV_1', 'Yard/AGV_2', 'Yard/Conv'].map((path, index) => ({
        path, x: 0, speed: query.get('pick') === 'none' ? 0
          : query.get('pick') === 'tie' ? [1, 1, 4][index] : [1, 3, 4][index],
      }));
      const area = document.createElement('div');
      area.style.cssText = 'position:fixed;right:20px;bottom:30px;width:400px;height:250px;z-index:5';
      document.body.appendChild(area);
      const addButton = (id, command, top, args, key) => {
        const button = document.createElement('button');
        button.id = id;
        button.dataset.rvCommandId = command;
        if (key) button.dataset.rvButtonId = key;
        button.textContent = command;
        button.style.cssText = `left:0;top:${top}px;width:240px;height:40px;font-size:18px`;
        button.addEventListener('click', () => { void execute(command, args); });
        area.appendChild(button);
        return button;
      };
      if (variant === 'mismatch') addButton('select-command', 'selection.select', 0, { path: 'A' });
      else {
        const reset = addButton('reset-command', 'sim.reset', 0, undefined, variant === 'ambiguous' ? undefined : 'reset');
        if (variant === 'hidden') reset.style.display = 'none';
        if (variant === 'ambiguous') addButton('reset-command-other', 'sim.reset', 50);
      }
      addButton('play-command', 'sim.playPause', 100);
      // plan-2237: a batch button, so a time-lapse can be dispatched by a recorded click.
      if (query.get('batchbutton') === '1') {
        const batchButton = addButton('batch-command', 'experiment.run', 0, { ticks: Number(query.get('ticks') ?? 90) });
        batchButton.style.cssText += ';position:absolute;left:0;top:-60px';
      }
      // plan-2237: UI buttons for time commands and for a Commercial command (community click path).
      if (query.get('stepbutton') === '1') {
        addButton('step-command', 'des.step', 0).style.cssText += ';position:absolute;left:0;top:-110px';
      }
      if (query.get('checkpointbutton') === '1' || query.get('checkpointbutton') === 'disabled') {
        const checkpoint = addButton('checkpoint-command', 'des.checkpoint.load', 0, { t: 0 });
        checkpoint.style.cssText += ';position:absolute;left:0;top:-160px';
        // A disabled button never dispatches — the case the recorder must diagnose before the click.
        if (query.get('checkpointbutton') === 'disabled') checkpoint.disabled = true;
      }
      const bar = document.createElement('div');
      bar.id = 'bar-agv';
      bar.style.cssText = 'position:absolute;left:0;top:160px;width:120px;height:30px;background:#087f5b';
      area.appendChild(bar);
      const dot = document.createElement('div');
      dot.id = 'node-dot';
      dot.style.cssText = 'position:absolute;left:0;top:210px;width:20px;height:20px;border-radius:50%;background:#fff';
      area.appendChild(dot);
      const rectOf = (element) => {
        const r = element.getBoundingClientRect();
        return { x: r.x, y: r.y, w: r.width, h: r.height };
      };
      const center = (element) => {
        if (!element || !element.isConnected) return null;
        const r = rectOf(element);
        const style = getComputedStyle(element);
        return r.w && r.h && style.display !== 'none' && style.visibility !== 'hidden'
          && Number(style.opacity) > 0 ? { x: r.x + r.w / 2, y: r.y + r.h / 2 } : null;
      };
      const report = (path, value) => fetch(`${path}?data=${encodeURIComponent(JSON.stringify(value))}`).catch(() => {});
      document.addEventListener('pointerdown', (event) => {
        void report('/geometry', {
          id: event.target.id, x: event.clientX, y: event.clientY,
          rect: rectOf(event.target), dot: center(dot), dotTicks: continuousMotion ? dotTicks - 1 : Math.min(dotTicks - 1, 15),
          bar: center(bar),
        });
      }, true);
      document.addEventListener('pointermove', () => { dotTicks = 1; }, { once: true });

      async function execute(id, args) {
        if (timeWatch?.has(id)) timeEvents.push({ id, phase: 'dispatch' });
        const result = await executeInner(id, args);
        if (timeWatch?.has(id)) timeEvents.push({ id, phase: 'done', ok: result.ok });
        return result;
      }

      async function executeInner(id, args) {
        let result = { ok: true, value: null };
        // plan-2237 F9: a Community build answers kind 'commercial-feature' for the Commercial families (measured on a VITE_PUBLIC_BUILD dist).
        if (community && ['des.checkpoint.', 'experiment.', 'snapshot.'].some((prefix) => id.startsWith(prefix))) {
          result = { ok: false, kind: 'commercial-feature', reason: 'experiment manager is a commercial module (realvirtual Commercial)' };
          const refused = { id, args, ok: false, kind: result.kind, reason: result.reason };
          executed.push(refused);
          if (watching) watch.push(refused);
          await report('/exec', refused);
          return result;
        }
        switch (id) {
          case 'sim.reset': viewer.simTime = 0; break;
          // plan-2237: one event gap — a jump without any change of mode, factor or pause.
          case 'des.step': viewer.simTime += 2.5; break;
          case 'sim.playPause':
            viewer.isSimulationPaused = typeof args?.paused === 'boolean' ? args.paused : !viewer.isSimulationPaused;
            break;
          case 'des.status': result.value = { subMode, multiplier }; break;
          // plan-2237 F2: the read-only clock query; reading it is not logged as an execution.
          case 'sim.clock.get':
            return { ok: true, value: {
              mode: desMode ? 'des' : 'continuous', paused: viewer.isSimulationPaused, simTime: viewer.simTime,
              fixedStepCount: viewer.fixedStepCount, factor: factorNow(), factorSource: desMode ? 'des-subMode' : 'speedOverride',
              ...(desMode ? { des: { subMode, multiplier, renderClock: viewer.simTime, simTime: viewer.simTime, endTime: null,
                clampedAt: null, clampCounts: { budget: 0, end: 0 } } } : {}),
            } };
          case 'sim.speedOverride': speed = Math.max(0, Math.min(100, Number(args?.factor ?? 1))); result.value = { factor: speed }; break;
          case 'des.setMode':
            if (args?.subMode) subMode = args.subMode;
            if (Number.isFinite(args?.multiplier)) multiplier = Math.max(1, args.multiplier);
            break;
          case 'des.fastForward':
            // A jump in the dispatch frame; FF ends paused (measured on the real viewer).
            viewer.simTime = Number(args?.untilSimTime ?? viewer.simTime + 3600);
            viewer.isSimulationPaused = true;
            break;
          case 'des.checkpoint.load':
            // Asynchronous like the real one: the jump lands 3 frames after dispatch, then step mode.
            await new Promise((resolve) => pending.push({ at: ticks + 3, resolve: () => {
              viewer.simTime = Number(args?.t ?? 0);
              subMode = 'step';
              resolve();
            } }));
            break;
          case 'experiment.run':
            // A batch that needs `ticks` animation frames — in a time-lapse those run on the wall clock.
            await new Promise((resolve) => pending.push({ at: ticks + Math.max(1, args?.ticks ?? 30), resolve, batch: true }));
            break;
          case 'experiment.run.cancel':
            for (let i = pending.length - 1; i >= 0; i--) if (pending[i].batch) pending.splice(i, 1)[0].resolve();
            break;
          case 'fixture.setMode': subMode = args.mode; break;
          case 'selection.select': break;
          case 'sim.slow':
            await new Promise((resolve) => pending.push({ at: ticks + Math.max(1, args?.ticks ?? 1), resolve }));
            break;
          case 'fixture.moveBar': bar.style.left = '160px'; break;
          case 'fixture.removeBar': bar.remove(); break;
          default: result = { ok: false, reason: 'unknown' };
        }
        const event = { id, args, ok: result.ok };
        executed.push(event);
        if (watching) watch.push(event);
        await report('/exec', event);
        return result;
      }
      window.__rvRecording = {
        execute,
        armCommandWatch() { watching = true; watch = []; },
        takeCommandWatch() { const events = watch; watch = []; return events; },
        stopCommandWatch() { watching = false; watch = []; },
        armTimeWatch(ids) { timeWatch = new Set(ids); timeEvents = []; },
        // plan-2237: the registry's verdict without executing — Community: Commercial ids are not
        // registered; `?commercial=disabled`: registered but not enabled (a production build without licence).
        async commandState(id) {
          const commercial = ['des.checkpoint.', 'experiment.', 'snapshot.'].some((prefix) => id.startsWith(prefix));
          if (community && commercial) return { known: false };
          if (query.get('commercial') === 'disabled' && commercial) return { known: true, enabled: false, reason: 'live checkpoints need a realvirtual Commercial licence' };
          return { known: true, enabled: true, reason: null };
        },
        takeTimeWatch() { const events = timeEvents; timeEvents = []; return events; },
        target(id, key) { return id === 'des-stats-bar' ? center(document.getElementById(`bar-${key}`)) : null; },
        nodeScreen(path, anchor) {
          const point = path === 'Yard/AGV_1' ? center(dot) : null;
          return point && { x: point.x, y: point.y - (anchor === 'top' ? 10 : 0) };
        },
        pickBegin(rule, among) {
          const token = ++nextPick;
          const pattern = new RegExp(`^${among.split('*').map((part) => part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('.*')}$`);
          picks.set(token, rule === 'moving-vehicle'
            ? nodes.filter((node) => pattern.test(node.path)).map((node) => ({ path: node.path, x: node.x })) : []);
          return token;
        },
        pickEnd(token, dt) {
          const start = picks.get(token) ?? [];
          picks.delete(token);
          const ranked = start.map((node) => ({ path: node.path,
            speed: (nodes.find((current) => current.path === node.path).x - node.x) / dt,
          })).filter((node) => node.speed > 0);
          ranked.sort((a, b) => b.speed - a.speed || (a.path < b.path ? -1 : a.path > b.path ? 1 : 0));
          return ranked.length ? { path: ranked[0].path } : { error: 'pick-no-match' };
        },
      };
      const animate = () => {
        ticks++;
        if (!viewer.isSimulationPaused) {
          const f = factorNow();
          if (f !== null) viewer.simTime += f / 30;
          viewer.fixedStepCount += 2;
          for (const node of nodes) node.x += node.speed;
        }
        if (continuousMotion && dotTicks > 0) {
          const offset = 3 * dotTicks++;
          dot.style.left = `${offset}px`;
          bar.style.left = `${offset}px`;
        } else if (dotTicks > 0 && dotTicks <= 15) dot.style.left = `${10 * dotTicks++}px`;
        for (let i = pending.length - 1; i >= 0; i--) {
          if (pending[i].at <= ticks) pending.splice(i, 1)[0].resolve();
        }
        // Native setup ticks have frame -1; preflight and capture use the runner's frame clock.
        const frame = window.__vt?.stats().enabled ? window.__vt.frame : -1;
        fetch(`/sim?frame=${frame}&t=${viewer.simTime}`).catch(() => {});
        requestAnimationFrame(animate);
      };
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
