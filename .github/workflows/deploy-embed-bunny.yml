name: Publish rv-embed to realvirtual.io

# Separate release gate: never runs on a normal main push. Configure the
# rv-embed-production environment with required reviewers for manual approval.
on:
  workflow_dispatch:
  push:
    tags:
      - 'rv-embed-v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rv-embed-production
    env:
      RV_EMBED_BUNNY_STORAGE_ZONE: ${{ secrets.RV_EMBED_BUNNY_STORAGE_ZONE }}
      RV_EMBED_BUNNY_STORAGE_KEY: ${{ secrets.RV_EMBED_BUNNY_STORAGE_KEY }}
      RV_EMBED_BUNNY_API_KEY: ${{ secrets.RV_EMBED_BUNNY_API_KEY }}
      RV_EMBED_BUNNY_REGION: storage.bunnycdn.com
      RV_EMBED_BUNNY_PULL_ZONE_ID: '5668163'
      RV_EMBED_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build tier-filtered rv-embed artifact
        run: npm run build:embed

      - name: Publish, purge non-hashed URLs and verify public delivery
        run: node scripts/embed-deploy.mjs

      - name: Published URLs
        run: |
          node -e "const p=require('./package.json'); const [a,b]=p.version.split('.'); console.log('https://realvirtual.io/embed/v'+a+'.'+b+'/');"
          echo "https://realvirtual.io/embed/latest/"
